<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><style>
*{box-sizing:border-box}body{margin:0;background:#DAD6D3;background-image:none;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--porcelain)}button{font:inherit;color:inherit;cursor:pointer;border:0;outline-offset:5px}button:focus-visible{outline:3px solid var(--accent)}button:active{transform:translateY(2px)}#viewport{position:relative;width:100vw;height:100vh;min-height:600px;overflow:hidden}#scene{position:absolute;transform-origin:0 0;overflow:hidden}p,h1,h2,h3{margin:0}#scene>.panel{position:absolute}.panel{background:var(--smoke);box-shadow:0 18px 55px #0002;border-radius:28px;color:var(--porcelain)}.logo{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:30px}.logo .mark{width:145px;height:145px}.logo h1{font-size:60px;font-weight:500;letter-spacing:6px;color:#2C3832}.logo .mark path{stroke:#35473A}.logo small{color:#536658;font-size:16px}.dialog{top:50%;left:50%;transform:translate(-50%,-50%);text-align:left}.dialog .mark{height:52px;width:52px;margin:0 0 26px -7px}.dialog h2{font-size:30px;line-height:1.3;font-weight:500;max-width:100%;margin-bottom:22px}.dialog p{font-size:20px;line-height:1.8;color:var(--muted)}.actions{display:flex;gap:14px;margin-top:32px}.action{padding:0 26px;background:var(--accent);color:#243E2C;border-radius:16px;font-weight:600;flex:1;box-shadow:inset 0 1px 0 #fff8,0 5px 12px #0002}.action.secondary{background:transparent;color:var(--porcelain);box-shadow:inset 0 0 0 1px #D6DDD548}.mode-note{font-size:14px;color:var(--muted);margin-top:22px;display:flex;align-items:center;gap:9px}.mode-note i{width:6px;height:6px;background:var(--accent);border-radius:100%}.counter{position:absolute;left:50%;transform:translateX(-50%);padding:16px 24px;display:flex;gap:0;align-items:center}.total{flex-shrink:0}.total strong{font-size:32px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}.total span{display:block;font-size:15px;color:var(--muted);margin-top:5px}.count-grid{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;gap:0}.count-cell{font-size:13px;display:flex;flex-direction:column;gap:5px;min-width:0}.count-cell b{font-weight:500;font-size:19px;color:var(--porcelain);font-variant-numeric:tabular-nums}.count-cell span{color:var(--muted);line-height:1.3;white-space:normal}.shelf{position:absolute;padding:24px}.shelf-title{font-size:20px;font-weight:500;margin-bottom:15px}.shelf-title small{float:right;color:var(--muted);font-size:13px;padding-top:4px}.strip{display:flex;gap:10px;overflow:auto;scrollbar-width:none;touch-action:pan-x}.strip::-webkit-scrollbar{display:none}.item{flex-shrink:0;background:transparent;border-radius:15px;text-align:left;padding:0;position:relative;overflow:hidden}.item.selected{box-shadow:inset 0 0 0 2px var(--accent);background:#B9E6C514}.item .thumb{width:100%;height:88px;border-radius:12px;opacity:.95;pointer-events:none;background-repeat:no-repeat}.item .caption{font-size:13px;display:block;padding:9px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.selected .caption{color:var(--accent)}.item.function{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:#FFFFFF09;text-align:center}.item.function svg{width:30px;height:30px;pointer-events:none}.item.function span{font-size:14px}.instructions{font-size:13px;color:var(--muted);margin-top:13px}.toast{position:absolute;left:50%;bottom:95px;transform:translateX(-50%);max-width:600px;padding:18px 24px;font-size:16px;background:var(--smoke);border-radius:16px;color:var(--porcelain)}.ghost{opacity:.25;pointer-events:none}.hand{width:70px;height:70px;margin-bottom:25px;color:var(--accent)}.exit h1{font-size:36px}.exit button{flex:0 0 220px}.gate-back{position:absolute;inset:0;background:#DAD6D326}
</style></head><body><div id="viewport"><main id="scene"></main></div><script id="pico-design-spec" type="application/json">__SPEC__</script><script>
const spec=JSON.parse(document.getElementById('pico-design-spec').textContent),data=spec.dataCases.normal,geo=data.geometry;
const params=new URLSearchParams(location.search),lang=params.get('lang')==='en'?'en':'zh',t=data.i18n[lang],root=document.getElementById('scene');
const symbols=__ICONS__;
for(const [k,v]of Object.entries(spec.theme.brandColors))document.documentElement.style.setProperty('--'+k,v);
document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t.name;
let state=params.get('state')||spec.initialStateId,selected=data.items[0].id,counts=structuredClone(data.counters),revealOrder=[],customCounts={},customModels=[],interruptedState='experience',consented=false,notice='',timer=null;
if(!spec.states.some(x=>x.id===state))state=spec.initialStateId;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function mark(){let x=el('div');x.innerHTML=symbols.mark;x.firstChild.classList.add('mark');return x.firstChild}
function button(label,handler,secondary=false){const b=el('button','action'+(secondary?' secondary':''),label);b.style.height=geo.controls.heightPx+'px';b.onclick=handler;return b}
function resize(){const scale=Math.min(innerWidth/geo.view.widthPx,innerHeight/geo.view.heightPx);Object.assign(root.style,{width:geo.view.widthPx+'px',height:geo.view.heightPx+'px',transform:`scale(${scale})`,left:(innerWidth-geo.view.widthPx*scale)/2+'px',top:(innerHeight-geo.view.heightPx*scale)/2+'px'})}addEventListener('resize',resize);resize();
function transition(event){if(event==='active-controller')interruptedState=state;if(event==='hands-tracked'&&state==='controller-gate')event=data.runtimePolicies.controllerResumeEvents[interruptedState];const tr=spec.transitions.find(x=>x.from===state&&x.trigger.event===event);if(!tr)return false;if(tr.id==='consent')consented=true;if(tr.id==='confirm-reset'){revealOrder=[];for(const k in counts)counts[k]=0;for(const k in customCounts)customCounts[k]=0;window.designReview.shattered?.clear()}state=tr.to;render();return true}
function notify(key){notice=t[key];render();clearTimeout(timer);timer=setTimeout(()=>{notice='';render()},geo.motion.transitionMs*8)}
function counters(){const c=el('section','panel counter');const visible=revealOrder.filter(id=>(counts[id]||customCounts[id]||0)>0);Object.assign(c.style,{width:Math.min(geo.counter.maxWidthPx,geo.counter.initialWidthPx+visible.length*geo.counter.cellWidthPx)+'px',height:geo.counter.heightPx+'px',top:geo.counter.topPx+'px'});c.setAttribute('aria-label',t.total);const a=el('div','total');a.style.width=geo.counter.totalWidthPx+'px';a.append(el('strong','',Object.values(counts).concat(Object.values(customCounts)).reduce((a,b)=>a+b,0)),el('span','',t.total));c.append(a);if(visible.length){const g=el('div','count-grid');g.setAttribute('aria-label',t.countNote);for(const id of visible){const it=data.items.find(x=>x.id===id)||customModels.find(x=>x.id===id);const cell=el('div','count-cell');cell.style.minWidth=geo.counter.cellWidthPx+'px';cell.append(el('b','',counts[id]||customCounts[id]),el('span','',it?it[lang]:t.custom));g.append(cell)}c.append(g)}return c}
function shelf(){const s=el('section','panel shelf');Object.assign(s.style,{width:geo.shelf.widthPx+'px',height:geo.shelf.heightPx+'px',right:geo.shelf.rightPx+'px',bottom:geo.shelf.bottomPx+'px'});const h=el('h3','shelf-title',t.shelf),sub=el('small','',t.glass+' / '+t.ceramic+' / '+t.plastic);h.append(sub);const strip=el('div','strip');strip.id='items-strip';data.items.forEach(it=>{const b=el('button','item'+(selected===it.id?' selected':''));b.style.width=geo.shelf.cardWidthPx+'px';b.style.height=geo.shelf.cardHeightPx+'px';b.setAttribute('aria-label',it[lang]);b.setAttribute('aria-pressed',String(selected===it.id));const thumb=el('div','thumb');thumb.style.backgroundImage=`url("${spec.assets.find(x=>x.id==='catalog').src}")`;thumb.style.backgroundSize='500% 300%';thumb.style.backgroundPosition=`${it.cell%5*25}% ${Math.floor(it.cell/5)*50}%`;const caption=el('span','caption',it[lang]);b.append(thumb,caption);b.onclick=()=>{const left=strip.scrollLeft;selected=it.id;render();document.getElementById('items-strip').scrollLeft=left};strip.append(b)});for(const k of ['refresh','reset']){const b=el('button','item function');b.style.width=geo.shelf.cardWidthPx+'px';b.style.height=geo.shelf.cardHeightPx+'px';b.innerHTML=symbols[k];b.append(el('span','',t[k]));b.setAttribute('aria-label',t[k]);b.onclick=()=>k==='reset'?transition('reset'):notify('empty');strip.append(b)}s.append(h,strip,el('p','instructions',t.instruction));return s}
function dialog(title,body){const d=el('section','panel dialog');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');Object.assign(d.style,{width:geo.modal.widthPx+'px',padding:geo.modal.paddingPx+'px',borderRadius:geo.modal.radiusPx+'px'});d.append(mark(),el('h2','',title),el('p','',body));return d}
function render(){root.replaceChildren();const current=spec.states.find(x=>x.id===state),node=spec.nodes.find(x=>x.id===current.surfaceRoots['experience-stage']),view=node.props.view;
if(['main','reset'].includes(view)||(view==='controller'&&interruptedState==='experience'&&consented)){const base=el('div');base.append(counters(),shelf());if(view!=='main')base.className='ghost';root.append(base)}
if(view==='logo'){const l=el('div','logo');l.append(mark(),el('h1','',t.name));root.append(l);if(!params.has('state'))setTimeout(()=>{if(state==='cold-logo')transition('timer')},geo.motion.logoMs)}
if(view==='safety'){const d=dialog(t.safetyTitle,t.safety),a=el('div','actions');a.append(button(t.leave,()=>transition('exit'),true),button(t.agree,()=>transition('agree')));d.append(a);root.append(d)}
if(view==='controller'){const d=dialog(t.controllerTitle,t.controller),note=el('div','mode-note');note.append(el('i'),el('span','',t.hands));d.append(note);root.append(d)}
if(view==='reset'){const d=dialog(t.resetTitle,t.resetBody),a=el('div','actions');a.append(button(t.cancel,()=>transition('cancel'),true),button(t.confirmReset,()=>transition('confirm')));d.append(a);root.append(d)}
if(view==='exit'){const d=dialog(t.exitTitle,''),a=el('div','actions');a.append(button(t.back,()=>{params.delete('state');transition('restart')}));d.append(a);root.append(d)}
if(notice)root.append(el('div','toast',notice));}
// Review harness only: no buttons pretending to implement physical MR events.
window.designReview={getState:()=>({state,selected,counts,consented}),event:transition,setCustomModels:models=>{customModels=models;for(const it of models)customCounts[it.id]??=0;render()},setState:id=>{if(spec.states.some(x=>x.id===id)){state=id;render()}},recordShatter:(id,objectInstanceId)=>{window.designReview.shattered??=new Set();if(!consented||state!=='experience'||window.designReview.shattered.has(objectInstanceId))return;window.designReview.shattered.add(objectInstanceId);if(!revealOrder.includes(id))revealOrder.push(id);if(id in counts)counts[id]++;else customCounts[id]=(customCounts[id]||0)+1;render()},status:key=>notify(key),hotResume:()=>{state=consented?'experience':'safety-gate';render()},coldRestart:()=>{consented=false;state='cold-logo';render()}};render();
</script></body></html>
